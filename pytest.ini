[pytest]
testpaths = tests
# The repo root goes on sys.path so tests import the package (`atharv_nandi.*`) and the dev tools (`tools.*`) (WPR).
pythonpath = .
# -rA: print a summary line (and captured output) for every test, incl. the measured closed-loop gait values
addopts = -rA --strict-markers
# Test tiers (WP0). Unmarked = unit tier: headless, ROS-free, <= 10 s wall each.
# Heavy selections run on a CI runner, never on a laptop. Typical selections:
#   per PR        pytest -m "not slow and not tour and not readiness"      (unit + gl + tour_lite)
#   nightly       pytest -m "slow or tour"
#   demo week     pytest -m readiness
markers =
    gl: needs an offscreen GL backend (MUJOCO_GL egl/osmesa); the test must skip cleanly without one
    slow: station tier, <= 3 min wall each; nightly plus PRs that touch tasks
    tour_lite: orchard_lite short tour regression, seed 7, <= 3 min wall; every PR
    tour: full orchard_demo tour; nightly over seeds 7/11/23
    readiness: 10 consecutive tours over 3 seeds; before a demo
