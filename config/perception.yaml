# Atharv Nandi perception config (simulated cameras, crop detector, WP5 pano / scheduler / privacy / LiDAR).
# Read by sim/perception_node.py, sim/controllers/camera_rig.py, sim/controllers/detector_model.py and the WP5
# modules (render_scheduler, pano, privacy_filter, self_mask; the lidar section is read by sim/hooks/lidar.py).
# The sha256 of this file's bytes is published in every /nandi/crop_detections message
# (model.sha256), so a change here is visible downstream. Keep to the simple YAML subset
# (nested mappings, scalars, inline [lists], # comments): the ROS-free tests parse it without PyYAML.

camera:
  name: head_cam            # camera used for detections and /nandi/camera/head/compressed
  width: 160                # px
  height: 120               # px
  head_fovy_deg: 70.0
  head_pitch_down_deg: 35.0
  head_pos_trunk: [0.35, 0.0, 0.06]   # trunk front, just above the trunk top (half height 0.05)
  wrist_fovy_deg: 60.0
  wrist_pos_body: [0.02, 0.0, 0.03]   # in the arm_wrist body, looking along the gripper (+x)
  near_m: 0.05

detector:
  name: sim_truth_noise
  seed: 7
  min_range_m: 0.10
  max_range_m: 2.5          # range cut: Euclidean distance from the camera centre
  fov_margin_px: 0.0        # crop centre must project at least this far inside the image
  crop_radius_m: 0.035
  occlusion_margin_m: 0.03  # visible if depth(u,v) >= z_centre - radius - margin
  pos_sigma_base_m: 0.015   # Gaussian position noise per axis: base + frac * range
  pos_sigma_range_frac: 0.01
  miss_rate: 0.05           # probability a visible crop is not reported
  fp_rate_per_frame: 0.05   # Poisson mean of false positives per frame
  fp_range_m: [0.4, 2.5]    # FP depth range along the ray, cut at the ground plane below
  fp_ground_z_m: 0.0        # world z of the ground plane that false positives may not go below
  conf_base: 0.95
  conf_range_slope: 0.10    # confidence lost per metre of range
  conf_edge_penalty: 0.15   # lost at the image border (linear from the centre)
  conf_sigma: 0.03
  conf_min: 0.05
  fp_conf: [0.25, 0.55]     # uniform confidence of false positives
  conf_threshold: 0.20      # detections below this are dropped
  bbox_sigma_px: 1.0
  oracle_ids: false         # true -> id_hint is the crop body name (debug only); false -> track ids
  track_gate_m: 0.25        # nearest-neighbour association gate (world frame); crops are >= 0.4 m apart
  track_max_age: 10         # frames a track survives without a match
  max_detections: 32

node:
  detection_rate_hz: 5.0    # /nandi/crop_detections (contract: <= 5 Hz)
  image_rate_hz: 2.0        # /nandi/camera/head/compressed; also the GL pass rate (depth for occlusion)
  render: true              # false -> geometric projection only (no GL, no occlusion, no image)
  jpeg_quality: 70
  render_budget_frac: 0.20  # superseded by scheduler.budget_frac (WP5, MVP-SPEC 3.8: 0.35); not read by the node any more

# ---------------------------------------------------------------------------- WP5 (MVP-SPEC 2.4, 3.7, 5.4; OS 2.5, 3.7, 5.6)
cameras:
  ring_width: 160           # MVP-SPEC 2.4: ring 160x120 RGB (the LUT and the self-masks use this size)
  ring_height: 120
  crown_width: 320          # OS 2.3: crown 320x240, fovy 60 (7.2 mm/px at 1.5 m)
  crown_height: 240
  wrist_width: 160
  wrist_height: 120
  capture_width: 320        # TREE 360 capture size (crown and the tree-side ring camera)
  capture_height: 240
  capture_seg_div: 2        # TREE 360 seg pass at 1/2 size (160 x 120), upsampled; OS 3.7 measured that pass
  cull_dist_m: 4.0          # OS 3.7 mjvScene camera-distance post-filter; 0 = off

scheduler:
  budget_frac: 0.35         # MVP-SPEC 3.8: render_budget_frac 0.20 -> 0.35
  burst_s: 0.3
  ring_cameras_per_s: 2.0   # round-robin: the full ring every 2 s
  rates_hz:
    head: 2.0
    wrist: 2.0
    crown: 0.5
  tick_hz: 10.0

pano:
  enabled: true
  width: 640
  height: 256
  el_min_deg: -56.0         # computed full-coverage band (see controllers/pano.py; spec -67..+17 leaves corners)
  el_max_deg: 5.0
  feather_deg: 5.0
  rate_hz: 1.0
  jpeg_quality: 70

lidar:
  rate_hz: 10.0             # sim process hook (sim/hooks/lidar.py)
  noise_sigma_m: 0.02
  range_max_m: 8.0
  publish_scans: true       # /nandi/scan (mast, 3 beams) and /nandi/scan_low (2 planes), JSON LaserScan shape
  cluster_range_m: 8.0
  trunk_window: 10          # scans accumulated by the low-plane trunk fit
  trunk_gate_m: 0.5
  ring_band:                # OS 2.5 cross-check of the trunk fit on the ring-depth band (sim: ring pixel rays over the ROI)
    enabled: true
    z_m: [0.20, 0.50]       # above the local ground: under the scaffolds (from ~0.6 m), over the basin rim
    noise_sigma_m: 0.01     # depth noise, assumption
    max_range_m: 2.5        # robot to prior; beyond it the cross-check reports out_of_range
    agree_m: 0.03           # centre delta to the low-plane fit that counts as agreement
    off_trunk_m: 0.05       # band centre farther than r + this from the prior and the primary: reason off_trunk (a sprout)
    radius_tol_m: 0.02      # free band radius vs registry trunk_r_m beyond this: radius_mismatch, agree false
    free_arc_min_deg: 100   # the free band radius is judged only on a free-fit arc this wide
    rate_hz: 2.0            # band rays re-cast at this rate (world points of a static trunk are reused between)

privacy:
  mode: assisted            # assisted: truth + detector masks; physics: detector mask only
  dilate_px: 4
  expand_frac: 0.20         # detector boxes expanded by 20 %
  near_m: 0.30              # an in-view person/cluster closer than this (or behind the camera) drops the frame
  parcel_mask: true         # drop pixels whose depth falls beyond the field geofence polygon
  clusters_max_age_s: 0.35  # /nandi/lidar/clusters older than this (sim time vs the rendered sim_state) are stale:
                            # physics mode drops the frame (fail closed), assisted mode keeps only the truth mask

self_mask:
  dilate_px: 2

colorblob:
  min_area_px: 6
  chroma_min: 0.45          # r / (r + g + b) of a ripe red crop (legacy spheres 0.9 0.15 0.15)
  v_min: 0.03               # max(r, g, b) floor, so black pixels are not red
  recall_min: 0.8           # dusk rule (MVP-SPEC 4.2): below this -> geometry detector + assist request
  check_rate_hz: 1.0        # ColorBlob recall check on head frames (the node runs it in step())

seen:
  min_bbox_px: 12           # MVP-SPEC 2.4 "seen": >= 12 px bbox, not self-masked, in a ring or head frame
  window_s: 10.0
