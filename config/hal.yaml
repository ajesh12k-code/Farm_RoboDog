# Atharv Nandi HAL configuration (WPCAP): the ros2_control <ros2_control> blocks as YAML (schema nandi.hal/1).
# Loader: sim/controllers/hal/interfaces.py (parse_hardware, build_resource_manager). Contract: docs/cap-libraries.md.
# Joint names are the MJCF joint names; command-interface min/max are clamps (joint limits enforcement).
# Velocity / acceleration limits are ASSUMED starting values (servo classes of docs/sim-fidelity-register.md:
# arm RMD-X8-25 / XM540 class, legs AK80-64 class with the 5 rad/s target rate limit of tripod_gait.py).
schema: nandi.hal/1
backend: mujoco            # mujoco | stub ; env NANDI_HAL_BACKEND overrides
update_rate_hz: 100

hardware:
  - name: nandi_arm
    type: system
    plugins:
      mujoco: atharv_nandi.core.hal.sim_backend.MujocoSystem
      stub: atharv_nandi.core.hal.stub_backend.StubSystem
    joints:
      - name: gantry_slide
        command_interfaces:
          position: {min: -0.26, max: 0.26}
          velocity: {min: -0.15, max: 0.15}
          effort: {min: -80.0, max: 80.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 0.15, max_acceleration: 0.5}
        gravity_feedforward: true
      - name: arm_yaw
        command_interfaces:
          position: {min: -3.14, max: 3.14}
          velocity: {min: -1.2, max: 1.2}
          effort: {min: -15.0, max: 15.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 1.2, max_acceleration: 3.0}
        gravity_feedforward: true
      - name: arm_shoulder
        command_interfaces:
          position: {min: -1.6, max: 2.4}
          velocity: {min: -1.0, max: 1.0}
          effort: {min: -30.0, max: 30.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 1.0, max_acceleration: 2.5}
        gravity_feedforward: true
      - name: arm_elbow
        command_interfaces:
          position: {min: -2.6, max: 2.6}
          velocity: {min: -1.2, max: 1.2}
          effort: {min: -15.0, max: 15.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 1.2, max_acceleration: 3.0}
        gravity_feedforward: true
      - name: arm_wrist_pitch
        command_interfaces:
          position: {min: -2.0, max: 2.0}
          velocity: {min: -1.5, max: 1.5}
          effort: {min: -5.0, max: 5.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 1.5, max_acceleration: 4.0}
        gravity_feedforward: true
      - names: [finger_left_joint, finger_right_joint]
        command_interfaces:
          position: {min: 0.0, max: 0.04}
          effort: {min: -25.0, max: 25.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 0.1, max_acceleration: 1.0}
    sensors:
      - name: tool_flange_ft
        state_interfaces: [force.x, force.y, force.z, torque.x, torque.y, torque.z]
        sources: {force: tool_flange_f, torque: tool_flange_t}

  - name: nandi_legs
    type: system
    plugins:
      mujoco: atharv_nandi.core.hal.sim_backend.MujocoSystem
      stub: atharv_nandi.core.hal.stub_backend.StubSystem
    joints:
      - names: [FR_hip_joint, FL_hip_joint, MR_hip_joint, ML_hip_joint, RR_hip_joint, RL_hip_joint]
        command_interfaces:
          position: {min: -0.7, max: 0.7}
          velocity: {min: -5.0, max: 5.0}
          effort: {min: -100.0, max: 100.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 5.0, max_acceleration: 50.0}
      - names: [FR_thigh_joint, FL_thigh_joint, MR_thigh_joint, ML_thigh_joint, RR_thigh_joint, RL_thigh_joint]
        command_interfaces:
          position: {min: -1.5, max: 2.5}
          velocity: {min: -5.0, max: 5.0}
          effort: {min: -100.0, max: 100.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 5.0, max_acceleration: 50.0}
      - names: [FR_calf_joint, FL_calf_joint, MR_calf_joint, ML_calf_joint, RR_calf_joint, RL_calf_joint]
        command_interfaces:
          position: {min: -2.6, max: -0.5}
          velocity: {min: -5.0, max: 5.0}
          effort: {min: -100.0, max: 100.0}
        state_interfaces: [position, velocity, effort]
        limits: {max_velocity: 5.0, max_acceleration: 50.0}
    sensors:
      - name: imu
        state_interfaces: [orientation.w, orientation.x, orientation.y, orientation.z,
                           angular_velocity.x, angular_velocity.y, angular_velocity.z,
                           linear_acceleration.x, linear_acceleration.y, linear_acceleration.z]
        sources: {orientation: imu_quat, angular_velocity: imu_gyro, linear_acceleration: imu_acc}

# Arm motion planning (sim/controllers/planning): margins are per obstacle class (m), see collision_scene.py.
planning:
  backend: auto            # auto | ompl | rrtconnect
  time_limit_s: 1.0
  edge_step: 0.02
  verify_step: 0.005
  rrt_range: 0.35
  seed: 7
  margins: {robot: 0.005, carriage: 0.0, keepout: 0.010, wood: 0.010, fruit: 0.010, fixture: 0.010, ground: 0.020}
