# Atharv Nandi tree generator parameters: mango (dwarf HDP). WP23, ORCHARD-MVP-SPEC 3.3.
# Every range is an (assumption) inside the cited ranges of OS 3.3 / ORCHARD-RESEARCH; heights in m, tree frame
# = trunk axis at the origin, world axes. Read by sim/world/trees.py (schema nandi.tree_species/1).
schema: nandi.tree_species/1
species: mango
archetype: canopy
label: "Mango, dwarf HDP (Dashehari / Amrapali class), grafted"
height_m: [1.5, 2.8]
trunk_frac: 0.35            # trunk height = 0.35 H (OS 3.3)
trunk_r_m: [0.05, 0.07]
canopy_r_frac: 0.45         # canopy ellipsoid r ~ 0.45 H, capped by the registry canopy_r_m
graft_union:
  h_m: [0.2, 0.3]
  rootstock_sprouts: [0, 2]
  sprout_mm: [4, 8]
scaffolds: {n: [3, 4], r_m: 0.035, branches_each: 2, branch_r_m: 0.015}
skirt: {n: [1, 2], z_m: [0.3, 0.7], diam_mm: [6, 11]}
skirt_mark: {n: [0, 1], z_m: [0.45, 0.65], diam_mm: [18, 22]}   # too thick for the 12 mm pruner -> MARK
water_shoots: {n: [0, 1], z_m: [1.3, 1.8], diam_mm: [14, 22]}
dead_twigs: {n: [0, 1], diam_mm: [5, 10]}
foliage: {blobs: 40, blob_m: [0.18, 0.18, 0.06], rgba: [0.15, 0.45, 0.15, 1.0]}
fruit:
  n: [14, 20]
  length_m: [0.07, 0.10]
  shape: [0.40, 0.36, 0.50]  # semi-axes as a fraction of the length (x, y, z); z = stem axis
  shell_z_m: [0.5, 2.5]
  pedicel_m: [0.05, 0.08]    # long pedicels (OS 3.3); cut_k sits pedicel_leave_cm above the stem end
  min_gap_m: 0.12
  demo_mature_in_band: 3     # OS 1.2 step 5: 3 mature in-band mangoes on OT-1
  mature_frac_out_of_band: 0.5
leaves: {n: 12, size_m: [0.11, 0.035], z_m: [0.5, 1.5]}
decals: {n: 4, r_m: [0.025, 0.04]}
leaf_decals: {n: 2, r_m: [0.004, 0.0075]}   # 8-15 mm colony/symptom level (OS 2.5)
panicles: {n: [8, 12], malformed: [1, 2]}
bags: true
